name: Build data and deploy

on:
  push:
    branches: [main]
    # Text-only changes (README, notes) don't need a rebuild
    paths-ignore:
      - "**/*.md"
      - "*.md"
      - "screenshots/**"
  schedule:
    - cron: "17 6 3 * *"   # monthly; police.uk publishes new data each month
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q tests
      - name: Download police archive and build map data
        run: python -m pipeline --months 12
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
