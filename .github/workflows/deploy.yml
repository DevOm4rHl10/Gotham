name: Build data and deploy

on:
  push:
    branches: [main]
    # Text-only changes (README, notes, screenshots) don't need a rebuild
    paths-ignore:
      - "**/*.md"
      - "*.md"
      - "screenshots/**"
  schedule:
    - cron: "17 6 3 * *"   # monthly; police.uk publishes new data each month
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q tests

      # Reuse the police archive while police.uk hasn't published a new month.
      # If the date check fails, use a unique key so a stale archive is never reused.
      - name: Check latest police data date
        id: police
        run: |
          date=$(curl -fsS --max-time 30 https://data.police.uk/api/crime-last-updated \
                 | python -c 'import json, sys; print(json.load(sys.stdin)["date"])') \
            || date="unknown-${GITHUB_RUN_ID}"
          echo "Police data last updated: $date"
          echo "date=$date" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: .cache
          key: police-archive-${{ steps.police.outputs.date }}

      - name: Build map data (downloads the archive only if not cached)
        run: python -m pipeline --months 12
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
